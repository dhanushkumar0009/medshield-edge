<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedShield Edge</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --ink:#1b2330; --muted:#5d6b7e; --brand:#0b5fff; --ok:#0a7d4f; --line:#dde3ec; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Segoe UI, system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:#0d1b2e; color:#fff; padding:18px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:2px 0 0; font-size:13px; color:#b9c6d8; }
  .badge { background:#0a7d4f; color:#fff; padding:6px 12px; border-radius:999px; font-size:12px; font-weight:600; }
  main { max-width:1100px; margin:20px auto; padding:0 16px; }
  .status { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 16px; display:flex; gap:24px; flex-wrap:wrap; font-size:13px; margin-bottom:16px; }
  .status b { color:var(--muted); font-weight:600; margin-right:4px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:800px) { .grid { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .card h2 { margin:0 0 8px; font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  textarea, .out { width:100%; min-height:340px; border:1px solid var(--line); border-radius:8px; padding:10px; font:14px/1.5 Consolas, monospace; background:#fbfcfe; white-space:pre-wrap; overflow:auto; }
  textarea { resize:vertical; }
  .bar { display:flex; gap:10px; margin:14px 0; flex-wrap:wrap; }
  button { border:0; border-radius:8px; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; }
  .primary { background:var(--brand); color:#fff; }
  .ghost { background:#e8edf5; color:var(--ink); }
  button:disabled { opacity:.6; cursor:wait; }
  mark { background:#ffe8a3; border-radius:4px; padding:0 3px; font-weight:600; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .chip { background:#eef3ff; color:#1646a8; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:600; }
  .err { color:#b42318; font-size:13px; margin-top:8px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>MedShield Edge</h1>
    <p>On-device PHI redaction for clinical notes &middot; built for Snapdragon-powered PCs</p>
  </div>
  <span class="badge">100% local &mdash; no data leaves this device</span>
</header>
<main>
  <div class="status" id="status">Loading status&hellip;</div>
  <div class="grid">
    <div class="card">
      <h2>Clinical note (input)</h2>
      <textarea id="input" placeholder="Paste a clinical note here, or click Load sample note"></textarea>
    </div>
    <div class="card">
      <h2>Redacted output</h2>
      <div class="out" id="output">Redacted text appears here.</div>
      <div class="stats" id="stats"></div>
    </div>
  </div>
  <div class="bar">
    <button class="ghost" id="sampleBtn">Load sample note</button>
    <button class="primary" id="redactBtn">Redact</button>
    <button class="ghost" id="copyBtn">Copy redacted text</button>
  </div>
  <div class="err" id="err"></div>
</main>
<script>
const $ = id => document.getElementById(id);
let lastRedacted = "";

async function loadStatus() {
  const s = await (await fetch("/api/status")).json();
  $("status").innerHTML =
    `<span><b>Mode:</b>${s.mode}</span>` +
    `<span><b>Runs on:</b>${s.provider}</span>` +
    `<span><b>Model:</b>${s.model || "none (rules only)"}</span>`;
}

function esc(t) { return t.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c])); }

function highlight(redacted) {
  return esc(redacted).replace(/\[(NAME|LOCATION|ORGANIZATION|SSN|EMAIL|URL|MRN|DOB|PHONE|DATE|ZIP)\]/g, "<mark>[$1]</mark>");
}

$("sampleBtn").onclick = async () => {
  const r = await (await fetch("/api/sample")).json();
  $("input").value = r.text;
};

$("redactBtn").onclick = async () => {
  $("err").textContent = "";
  $("redactBtn").disabled = true;
  try {
    const res = await fetch("/api/redact", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ text: $("input").value }) });
    const data = await res.json();
    if (!res.ok) { $("err").textContent = data.error || "Something went wrong."; return; }
    lastRedacted = data.redacted_text;
    $("output").innerHTML = highlight(data.redacted_text);
    const chips = Object.entries(data.counts).map(([k, v]) => `<span class="chip">${k}: ${v}</span>`).join("");
    $("stats").innerHTML = `<span class="chip">${data.total} items removed</span>${chips}<span class="chip">${data.latency_ms} ms</span><span class="chip">${data.provider}</span>`;
  } catch (e) {
    $("err").textContent = "Could not reach the local server.";
  } finally {
    $("redactBtn").disabled = false;
  }
};

$("copyBtn").onclick = async () => {
  if (lastRedacted) { await navigator.clipboard.writeText(lastRedacted); $("copyBtn").textContent = "Copied"; setTimeout(() => $("copyBtn").textContent = "Copy redacted text", 1200); }
};

loadStatus();
</script>
</body>
</html>
